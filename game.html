<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Water Walk — charity: water</title>
<style>
  :root{
    --yellow:#FFC907;
    --blue:#2E9DF7;
    --teal:#8BD1CB;
    --black:#000000;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family: 'Avenir Next', Avenir, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(180deg, var(--blue), var(--teal));
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #game{
    position:relative;
    width: 480px;
    max-width: 100vw;
    height: 800px;
    max-height: 100vh;
    overflow:hidden;
    background: linear-gradient(180deg, var(--blue), var(--teal) 80%);
  }
  #ground{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 22%;
    background:#D9A066;
    border-top: 4px solid #B8834A;
  }
  #logo{
    position:absolute;
    top:20px; left:50%;
    transform: translateX(-50%);
    display:flex; align-items:center; gap:8px;
    color:#fff; font-size:15px; font-weight:600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    z-index: 5;
  }
  .can-icon{ width:16px; height:19px; background:var(--yellow); border-radius:2px; }

  #hud{
    position:absolute;
    top: 55px; left:0; right:0;
    display:flex; justify-content:space-between;
    padding: 0 20px;
    z-index: 5;
  }
  .pill{
    background: rgba(0,0,0,0.4);
    color:#fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-weight:700;
    font-size:14px;
  }
  .pill span.label{ color: var(--yellow); font-weight:700; margin-right:6px; }

  #screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding: 0 30px;
    z-index: 10;
  }
  #screen h1{
    font-size: 46px;
    color:#fff;
    font-weight:800;
    line-height:1.05;
  }
  #screen h1 span{ color: var(--yellow); display:block; }
  #screen p{
    color:#fff;
    margin: 14px 0 26px;
    font-size: 15px;
    opacity:.9;
    max-width: 320px;
  }
  button.cta{
    background: var(--yellow);
    color:#000;
    border:none;
    font-weight:800;
    font-size: 17px;
    padding: 16px 34px;
    border-radius: 10px;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(255,201,7,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.cta:hover{ transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 22px rgba(255,201,7,0.55); }
  button.cta:active{ transform: translateY(0) scale(0.98); }

  #player{
    position:absolute;
    bottom: 22%;
    left: 90px;
    width: 46px; height: 90px;
    z-index: 4;
    transition: transform 0.28s ease-out;
  }
  #player .head{ position:absolute; top:0; left:14px; width:18px; height:18px; background:#3B2A20; border-radius:50%; }
  #player .body{ position:absolute; top:16px; left:9px; width:28px; height:38px; background:#FF902A; border-radius:8px; }
  #player .can{ position:absolute; top:14px; left:30px; width:14px; height:18px; background:var(--yellow); border-radius:3px; }
  #player.jump{ transform: translateY(-130px); }

  .obstacle, .collectible{
    position:absolute;
    bottom: 22%;
    z-index: 3;
  }
  .obstacle{
    width: 72px; height: 30px;
    background: repeating-linear-gradient(45deg, #5A3A1E, #5A3A1E 8px, #3E2712 8px, #3E2712 16px);
    border: 3px solid #2A1A0C;
    border-radius: 10px 10px 4px 4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.35);
  }
  .obstacle::after{
    content: "⚠";
    position:absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
  }
  .collectible{
    width: 26px; height: 30px;
    background: var(--yellow);
    border-radius: 4px;
  }

  #toast{
    position:absolute;
    top: 40%;
    left:50%;
    transform: translate(-50%,-50%);
    background:#fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight:700;
    font-size:13px;
    opacity:0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 6;
    text-align:center;
  }
  #toast.show{ opacity:1; transform: translate(-50%,-60%); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="game">
  <div id="logo"><span class="can-icon"></span> charity: water</div>
  <div id="hud" class="hidden">
    <div class="pill"><span class="label">MI</span><span id="distance">0.0</span></div>
    <div class="pill"><span class="label">🚰</span><span id="cans">0</span></div>
  </div>

  <div id="ground"></div>
  <div id="player"><div class="head"></div><div class="body"></div><div class="can"></div></div>
  <div id="toast"></div>

  <div id="screen">
    <h1>THE WATER<span>WALK</span></h1>
    <p>Collect clean water. Dodge dirty puddles. See how far a walk for water really goes.</p>
    <button class="cta" id="startBtn">START WALKING →</button>
  </div>
</div>

<script>
const screen = document.getElementById('screen');
const hud = document.getElementById('hud');
const player = document.getElementById('player');
const gameEl = document.getElementById('game');
const distanceEl = document.getElementById('distance');
const cansEl = document.getElementById('cans');
const toast = document.getElementById('toast');
const startBtn = document.getElementById('startBtn');

let running = false;
let distance = 0;
let cans = 0;
let jumping = false;
let spawnTimer = 0;
let obstacleCooldown = 0;
let speed = 1.6;
let entities = [];
let loopId = null;
let milestoneShown = false;

const REAL_WALK_MILES = 3.7;

function reset(){
  distance = 0; cans = 0; speed = 1.6; entities.forEach(e => e.el.remove());
  entities = []; milestoneShown = false; obstacleCooldown = 60;
  distanceEl.textContent = '0.0';
  cansEl.textContent = '0';
}

function startGame(){
  reset();
  screen.classList.add('hidden');
  hud.classList.remove('hidden');
  running = true;
  spawnTimer = 0;
  loopId = requestAnimationFrame(loop);
}

function showToast(msg, ms=1600){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), ms);
}

let jumpTimeoutId = null;
function jump(){
  if(!running) return;
  jumping = true;
  player.classList.add('jump');
  clearTimeout(jumpTimeoutId);
  jumpTimeoutId = setTimeout(() => {
    player.classList.remove('jump');
    jumping = false;
  }, 1000);
}

function spawnEntity(){
  const isObstacle = Math.random() < 0.45 && obstacleCooldown <= 0;
  if(isObstacle) obstacleCooldown = 170;
  const el = document.createElement('div');
  el.className = isObstacle ? 'obstacle' : 'collectible';
  el.style.left = gameEl.clientWidth + 'px';
  gameEl.appendChild(el);
  entities.push({ el, x: gameEl.clientWidth, type: isObstacle ? 'obstacle' : 'collectible' });
}

function endGame(){
  running = false;
  cancelAnimationFrame(loopId);
  const miles = distance.toFixed(1);
  screen.querySelector('h1').innerHTML = 'GAME OVER';
  screen.querySelector('p').innerHTML =
    `You walked <strong>${miles} mi</strong> and collected <strong>${cans}</strong> clean water cans.<br><br>` +
    `In many communities, a daily walk for water averages <strong>${REAL_WALK_MILES} mi</strong> — every day, just to get water most of us take for granted.`;
  startBtn.textContent = 'HELP SHORTEN THE WALK →';
  startBtn.onclick = () => window.open('https://www.charitywater.org/', '_blank');
  const retry = document.createElement('button');
  retry.textContent = 'RETRY';
  retry.className = 'cta';
  retry.style.background = 'transparent';
  retry.style.color = '#fff';
  retry.style.boxShadow = 'none';
  retry.style.marginTop = '10px';
  retry.style.border = '2px solid #fff';
  retry.onclick = () => { location.reload(); };
  screen.appendChild(retry);
  screen.classList.remove('hidden');
}

function loop(){
  if(!running) return;

  distance += 0.012;
  distanceEl.textContent = distance.toFixed(1);

  if(!milestoneShown && cans >= 5){
    milestoneShown = true;
    showToast('💧 Milestone: In Africa, women spend 40 billion hours a year walking for water.', 2400);
  }

  spawnTimer++;
  if(spawnTimer > Math.max(70 - Math.floor(distance), 40)){
    spawnTimer = 0;
    spawnEntity();
  }
  if(obstacleCooldown > 0) obstacleCooldown--;

  const groundY = gameEl.clientHeight * 0.22;
  const playerLeft = 90, playerRight = 90 + 46;

  entities.forEach(e => {
    e.x -= speed;
    e.el.style.left = e.x + 'px';
  });

  entities = entities.filter(e => {
    const hit = e.x < playerRight && e.x + (e.type==='obstacle'?72:26) > playerLeft;
    if(hit && !jumping){
      if(e.type === 'obstacle'){
        e.el.remove();
        endGame();
        return false;
      } else {
        cans++;
        cansEl.textContent = cans;
        showToast('+1 can collected', 700);
        e.el.remove();
        return false;
      }
    }
    if(e.x < -70){ e.el.remove(); return false; }
    return true;
  });

  speed = 1.6 + distance * 0.04;

  if(running) loopId = requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
document.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
gameEl.addEventListener('touchstart', () => { if(running) jump(); });
gameEl.addEventListener('mousedown', () => { if(running) jump(); });
</script>

</body>
</html>
